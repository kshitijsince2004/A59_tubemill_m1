services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tubemill
      POSTGRES_PASSWORD: tubemill
      POSTGRES_DB: tubemill
    ports:
      - "5433:5432"
    volumes:
      - tubemill_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tubemill"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SuperTokens Core (auth). Shares the app Postgres with st_ table prefix.
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:11.0.1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://tubemill:tubemill@db:5432/tubemill"
      POSTGRESQL_TABLE_NAMES_PREFIX: "st_"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e \"GET /hello HTTP/1.1\\r\\nhost: 127.0.0.1:3567\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"Hello\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://m1_app:m1_app@db:5432/tubemill
      MIGRATE_DATABASE_URL: postgresql://tubemill:tubemill@db:5432/tubemill
      TENANT_ID: "00000000-0000-4000-8000-000000000001"
      AUTH_MODE: static
      AUTH_STRICT: "true"
      AUTH_ALLOW_HEADER_ROLE: "false"
      SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
      API_DOMAIN: http://localhost:3001
      WEBSITE_DOMAIN: http://localhost:3001
      COLLECTOR_MODE: sim
      SERVICE_TOKEN: ${SERVICE_TOKEN:-change-me-in-production}
      CORS_ORIGIN: same-origin
      YIELD_TOLERANCE_PCT: "2"
    depends_on:
      db:
        condition: service_healthy
      supertokens:
        condition: service_healthy

volumes:
  tubemill_pg:
